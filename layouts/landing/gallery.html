{{ define "main" }}
<main class="px-4 mx-auto max-w-screen-xl">
    <style>
        /* 统一标题样式 */
        .page-title {
            text-align: center;
            font-size: 1.875rem; /* 对应 text-3xl */
            font-weight: 700; /* 对应 font-bold */
            margin-top: 1.5rem; /* 对应 my-6 */
            margin-bottom: 1.5rem; /* 对应 my-6 */
        }
        main, .container, .content, .post, .single {
            max-width: none !important;
            width: 100% !important;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h2 {
            text-align: center;
            margin: 20px 0 10px;
            color: #333;
        }
        .gallery-thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* 固定最小宽度更美观 */
            gap: 30px; /* 增加间距 */
            padding: 30px; /* 增加内边距 */
        }
        .thumbnail-container {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background: #e0e0e0;
            aspect-ratio: 3 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumbnail-container:hover {
            transform: scale(1.05); /* 轻微放大 */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2); /* 增强阴影 */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 或 object-fit: cover */
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .thumbnail-container img.loaded {
            opacity: 1;
        }
        .thumbnail-container .loading-text {
            position: absolute;
            font-size: 14px;
            color: #666;
        }
        .modal {
            display: none; /* 默认隐藏 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* 确保 .modal-content 始终可见 */
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            display: block;
            margin: 0 auto;
            transform-origin: center;
            transition: transform 0.1s ease-out;
            cursor: grab;
            user-select: none;
        }
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: #1E90FF; /* 改为图片中的蓝色 */
            color: white;
            border: none;
            font-size: 1.5em;
            width: 40px; /* 固定宽度 */
            height: 40px; /* 固定高度 */
            line-height: 40px; /* 垂直居中文本 */
            text-align: center; /* 水平居中文本 */
            cursor: pointer;
            z-index: 1;
            border-radius: 4px; /* 轻微圆角 */
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .modal-nav:hover {
            background-color: #1873CC; /* 悬停时颜色变深 */
            transform: translateY(-50%) scale(1.1); /* 轻微放大 */
        }
        .modal-nav.left { left: 20px; }
        .modal-nav.right { right: 20px; }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #1E90FF; /* 改为图片中的蓝色 */
            color: white;
            border: none;
            font-size: 1.5em;
            width: 40px; /* 固定宽度 */
            height: 40px; /* 固定高度 */
            line-height: 40px; /* 垂直居中文本 */
            text-align: center; /* 水平居中文本 */
            cursor: pointer;
            border-radius: 4px; /* 轻微圆角 */
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .close-modal:hover {
            background-color: #1873CC; /* 悬停时颜色变深 */
            transform: scale(1.1); /* 轻微放大 */
        }
        .modal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .modal-loading .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #2196F3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* 移动端优化 */
        @media (max-width: 768px) {
            .modal-content {
                max-width: 98%;
                max-height: 98%;
            }
            .modal-content img {
                max-height: 90vh;
                width: 100%;
                object-fit: contain;
            }
        }
    </style>

    <h1 class="page-title">{{ .Title }}</h1>

    <div id="gallery-container"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <img src="" alt="Main Image" id="modalImage">
            <button class="modal-nav left" onclick="showPreviousImage()">❮</button>
            <button class="modal-nav right" onclick="showNextImage()">❯</button>
            <div class="modal-loading" id="modalLoading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        window.GALLERY_CONFIG = {
            dataUrl: '/data/gallery-data.json'
        };
    </script>

    <script src="/js/gallery.js"></script>
</main>
{{ end }}
