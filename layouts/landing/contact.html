{{ define "main" }}
<style>
    .contact-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .contact-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }
    .contact-details {
        width: 100%;
        max-width: 100%;
    }
    .contact-image {
        width: 100%;
        text-align: center;
    }
    .contact-image img {
        width: 100%;
        height: auto;
        max-width: 100%;
    }
    @media (min-width: 768px) {
        .contact-container {
            flex-direction: row;
            justify-content: center; /* 居中对齐 */
            align-items: flex-end; /* 底部对齐 */
            gap: 20px; /* 保持间距 */
        }
        .contact-details {
            max-width: 45%; /* 保持文字区域宽度 */
        }
        .contact-image {
            max-width: 50%; /* 保持图片区域宽度 */
        }
        .contact-image img {
            max-height: 400px; /* 限制图片最大高度，避免过高 */
            object-fit: cover; /* 确保图片填充区域 */
        }
    }
    .page-title {
        text-align: center;
        font-size: 1.875rem;
        font-weight: 700;
        margin-top: 1.5rem;
        margin-bottom: 1.5rem;
    }
</style>

<div class="contact-wrapper">
    <h1 class="page-title">{{ .Title }}</h1>

    <div class="contact-container">
        <div class="contact-details">
            {{ .Content }}
        </div>
        <div class="contact-image">
            <img src="/images/图书馆鸟瞰(960).png?fm=webp" alt="图书馆鸟瞰">
        </div>
    </div>
</div>
{{ end }}
